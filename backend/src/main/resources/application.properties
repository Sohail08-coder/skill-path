# ==========================================
# SkillPath-AI Spring Boot Configuration
# ==========================================
spring.application.name=SkillPath-AI
server.port=${PORT:8080}

# --- Database Configuration ---
# Configurable Datasource (defaults to H2 in-memory for zero-setup local development and tests)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:skillpath_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (for debugging - visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pure REST API - Disable Whitelabel HTML Error View
server.error.whitelabel.enabled=false

# --- Security & JWT Configuration ---
# Configurable JWT Secret (256-bit key for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:SkillPathAiSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app}