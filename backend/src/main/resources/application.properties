# ==========================================
# SkillPath-AI Spring Boot Configuration
# ==========================================
spring.application.name=SkillPath-AI
server.port=8080

# --- Database Configuration ---
# Use H2 in-memory database (always available, no MySQL required)
spring.datasource.url=jdbc:h2:mem:skillpath_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging - visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Thymeleaf Template Engine
spring.thymeleaf.cache=false