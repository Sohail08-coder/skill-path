<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - SkillPath AI</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FDFBF7;
            color: #432818;
            padding: 30px 15px;
        }

        .container {
            width: 760px;
            max-width: 95%;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(67, 40, 24, 0.08);
            border: 1px solid #BB9457;
        }

        h1 {
            text-align: center;
            color: #6F1D1B;
            margin-top: 0;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #5C3D2E;
            margin-bottom: 30px;
        }

        .alert-box {
            background: #FFE6A7;
            border: 1.5px solid #BB9457;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #432818;
        }

        .gaps-box {
            background: rgba(111, 29, 27, 0.08);
            border: 1.5px solid #6F1D1B;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #6F1D1B;
        }

        .gaps-box ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #432818;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1.5px solid #BB9457;
            color: #432818;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6F1D1B;
            box-shadow: 0 0 0 3px rgba(111, 29, 27, 0.2);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6F1D1B;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(111, 29, 27, 0.35);
            transition: background-color 0.2s, transform 0.2s;
        }

        button:hover {
            background: #541614;
            transform: translateY(-2px);
        }

        .nav-link-top {
            display: inline-block;
            margin-bottom: 20px;
            color: #99582A;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }
        .nav-link-top:hover {
            color: #6F1D1B;
        }
    </style>
</head>

<body>

<div class="container">
    <a href="/" class="nav-link-top">← Back to Home</a>

    <!-- Success Message and Analysis Feedback -->
    <div th:if="${successMessage}" class="alert-box">
        <strong th:text="${successMessage}">Profile saved successfully!</strong>
        <p style="margin: 6px 0 0;" th:if="${savedStudent}">
            Registered: <span th:text="${savedStudent.name}"></span> (<span th:text="${savedStudent.careerGoal}"></span>)
        </p>
    </div>

    <div th:if="${missingSkills != null and !missingSkills.isEmpty()}" class="gaps-box">
        <strong>Identified Skill Gaps for Target Role:</strong>
        <ul>
            <li th:each="skill : ${missingSkills}" th:text="${skill}"></li>
        </ul>
    </div>

    <h1>Student Profile</h1>

    <p class="subtitle">
        Enter your details to create your SkillPath AI profile and run gap analysis.
    </p>

    <form action="/profile" method="post">

        <label>Name</label>
        <input type="text"
               name="name"
               placeholder="Enter your name"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Branch</label>
        <select name="branch" required>
            <option value="">Select your branch</option>
            <option value="CSE">CSE</option>
            <option value="AI & ML">AI & ML</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Other">Other</option>
        </select>

        <label>Year</label>
        <select name="year" required>
            <option value="">Select year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <label>CGPA</label>
        <input type="number"
               name="cgpa"
               step="0.01"
               min="0"
               max="10"
               placeholder="Example: 8.5"
               required>

        <label>Technical Skills</label>
        <textarea name="skills"
                  placeholder="Example: Java, Python, SQL, HTML, Machine Learning"></textarea>

        <label>Interests</label>
        <textarea name="interests"
                  placeholder="Example: Artificial Intelligence, Web Development"></textarea>

        <label>Projects</label>
        <textarea name="projects"
                  placeholder="Example: Student Management System"></textarea>

        <label>Certifications</label>
        <textarea name="certifications"
                  placeholder="Example: NPTEL, Coursera, AWS"></textarea>

        <label>Career Goal</label>
        <select name="careerGoal" required>
            <option value="">Select your career goal</option>
            <option value="Software Developer">Software Developer</option>
            <option value="AI / ML Engineer">AI / ML Engineer</option>
            <option value="Data Scientist">Data Scientist</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Cloud Engineer">Cloud Engineer</option>
            <option value="DevOps Engineer">DevOps Engineer</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">
            Save Student & Analyze Skills
        </button>

    </form>

</div>

</body>
</html>
