<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillPath AI</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 52px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            font-weight: 800;
        }

        h2 {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .button {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 34px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>SkillPath AI</h1>

        <h2>Personalized Career and Skill Planner</h2>

        <p>
            Build your skills. Discover your career path. Plan your future with AI-driven skill gap benchmarks and milestone roadmaps.
        </p>

        <a href="/profile" class="button">
            Get Started →
        </a>
    </div>

</body>
</html>
