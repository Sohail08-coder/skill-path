<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillPath AI</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FDFBF7;
            color: #432818;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 52px;
            color: #6F1D1B;
            margin-bottom: 12px;
            font-weight: 800;
        }

        h2 {
            color: #432818;
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            color: #5C3D2E;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .button {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 34px;
            background: #6F1D1B;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(111, 29, 27, 0.35);
            transition: transform 0.2s, background-color 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #541614;
            box-shadow: 0 8px 25px rgba(111, 29, 27, 0.45);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>SkillPath AI</h1>

        <h2>Personalized Career and Skill Planner</h2>

        <p>
            Build your skills. Discover your career path. Plan your future with AI-driven skill gap benchmarks and milestone roadmaps.
        </p>

        <a href="/profile" class="button">
            Get Started →
        </a>
    </div>

</body>
</html>
