# ==============================================================================
# Render Blueprint Specification for SkillPath-AI Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: skillpath-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500,https://*.netlify.app,https://*.onrender.com,https://*.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # Optional: To connect Render PostgreSQL, create a Postgres database on Render
      # and supply the credentials below (defaults to in-memory H2 if omitted):
      # - key: SPRING_DATASOURCE_URL
      #   fromDatabase:
      #     name: skillpath-db
      #     property: connectionString
